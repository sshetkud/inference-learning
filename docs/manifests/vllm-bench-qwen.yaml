# vLLM benchmark Job: concurrency sweep against the in-cluster vllm-qwen Service.
# Key fix: pass --tokenizer <local path> so `vllm bench serve` does NOT try to
# fetch the tokenizer for a locally-served model from HuggingFace (avoids HF 401).
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-bench-qwen
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: vllm-bench-qwen
    spec:
      restartPolicy: Never
      nodeSelector:
        reservation.lab.amd/owner: sshetkud
      tolerations:
      - key: reservation.lab.amd/owner
        operator: Equal
        value: sshetkud
        effect: NoSchedule
      containers:
      - name: bench
        image: vllm/vllm-openai-rocm:kimi-k3
        imagePullPolicy: IfNotPresent
        command: ["bash","-lc"]
        args:
        - |
          set -u
          MODEL=Qwen3.5-35B-A3B
          URL=http://vllm-qwen:8000
          OUT=/mnt/dcgpuval/bench_qwen_$(date +%Y%m%d_%H%M%S)
          mkdir -p "$OUT"
          echo "waiting for server /v1/models ..."
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/v1/models" || true)
            if [ "$code" = "200" ]; then echo "server_ready after ${i} tries"; break; fi
            sleep 5
          done
          for C in 16 32 64 128; do
            N=$((C*5)); if [ "$N" -lt 64 ]; then N=64; fi
            echo "================ concurrency=$C num_prompts=$N ================"
            vllm bench serve \
              --backend openai \
              --model "$MODEL" \
              --tokenizer /mnt/dcgpuval/models/Qwen/Qwen3.5-35B-A3B \
              --base-url "$URL" \
              --endpoint /v1/completions \
              --dataset-name random \
              --random-input-len 8192 \
              --random-output-len 1024 \
              --num-prompts "$N" \
              --max-concurrency "$C" \
              --ignore-eos \
              --percentile-metrics ttft,tpot,itl,e2el \
              --save-result --result-dir "$OUT" --result-filename "c${C}.json" \
              || echo "bench c=$C FAILED"
          done
          echo "================ ALL DONE ================"
          echo "results dir: $OUT"
          ls -la "$OUT"
        volumeMounts:
        - name: model
          mountPath: /mnt/dcgpuval
      volumes:
      - name: model
        hostPath:
          path: /mnt/dcgpuval
          type: Directory
